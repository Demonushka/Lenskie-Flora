name: lenskie_flora
description: Интерактивный определитель редких и исчезающих растений национального парка «Ленские столбы».
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  geolocator: ^14.0.1
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  flutter_svg: ^2.2.3
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/photos/
    - assets/images/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Neucha
      fonts:
        - asset: assets/fonts/Neucha-Regular.ttf
